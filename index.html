<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
</head>
<body style="margin:0; background:black; overflow:hidden;">

<!-- 右上カメラ -->
<video id="video" autoplay playsinline
style="
position:fixed;
top:20px;
right:20px;
width:140px;
height:200px;
object-fit:cover;
border-radius:15px;
border:2px solid white;
">
</video>

<!-- REC表示 -->
<div id="rec" style="
position:fixed;
top:20px;
right:170px;
color:red;
font-weight:bold;
display:none;
">
● REC
</div>

<!-- 録画ボタン -->
<button id="btn" style="
position:fixed;
bottom:30px;
left:50%;
transform:translateX(-50%);
padding:15px 25px;
font-size:18px;
border:none;
border-radius:10px;
background:red;
color:white;
">
録画
</button>

<script>
let stream;
let recorder;
let chunks = [];

async function startCamera() {
  stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: "user" },
    audio: false
  });
  video.srcObject = stream;
}

// 最初にカメラ起動（ボタン押したとき）
btn.addEventListener("click", async () => {

  if (!stream) {
    await startCamera();
  }

  chunks = [];

  recorder = new MediaRecorder(stream);
  recorder.ondataavailable = e => chunks.push(e.data);

  recorder.onstop = () => {
    const blob = new Blob(chunks, { type: "video/webm" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "video.webm";
    a.click();
    rec.style.display = "none";
    btn.textContent = "録画";
  };

  recorder.start();
  rec.style.display = "block";
  btn.textContent = "録画中...";

  setTimeout(() => {
    recorder.stop();
  }, 10000); // 10秒
});
</script>

</body>
</html>
